<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JLPT N5 総合全方位摸底特訓 〜試練の社〜</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Yuji+Boku&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #261613 0%, #120a08 100%);
      font-family: 'Shippori Mincho', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
      color: #38251e;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Falling Sakura Canvas */
    #sakura-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* 16:9 Traditional Japanese Shrine Frame */
    .shrine-viewport {
      width: min(96vw, 170.6vh);
      height: min(54vw, 96vh);
      aspect-ratio: 16 / 9;
      background: #fbf7ee;
      background-image: 
        radial-gradient(#eedec6 12%, transparent 13%), 
        linear-gradient(to bottom, rgba(255,255,255,0.7), rgba(250,240,225,0.9));
      background-size: 24px 24px, 100% 100%;
      border: 8px solid #991b1b;
      border-radius: 8px;
      box-shadow: 
        0 0 0 3px #ca8a04,
        0 0 0 7px #450a0a,
        0 18px 45px rgba(0, 0, 0, 0.95);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 20;
    }

    /* Top Torii Shrine Header */
    .torii-header {
      background: linear-gradient(180deg, #991b1b 0%, #7f1d1d 100%);
      border-bottom: 4px solid #ca8a04;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fef08a;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      position: relative;
      z-index: 25;
    }

    .shrine-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 1px 1px 2px #000;
    }

    .shrine-logo svg {
      width: 26px;
      height: 26px;
      fill: #fef08a;
    }

    .header-ctrls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .washi-badge {
      background: #450a0a;
      border: 1px solid #ca8a04;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.82rem;
      color: #fef08a;
      font-weight: 700;
    }

    .btn-nav-catalog {
      background: #ca8a04;
      color: #38251e;
      border: none;
      border-radius: 4px;
      padding: 5px 12px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.82rem;
      box-shadow: 0 2px 0 #78350f;
      transition: all 0.1s ease;
    }

    .btn-nav-catalog:hover { background: #eab308; }
    .btn-nav-catalog:active { transform: translateY(2px); box-shadow: none; }

    /* Main Stage Body */
    .stage-content {
      flex: 1;
      padding: 12px 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
    }

    .part-ribbon {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      background: #dc2626;
      color: #ffffff;
      padding: 3px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 3px;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
      margin-bottom: 8px;
    }

    /* Ema / Shrine Illustration Viewport */
    .shrine-illustration-box {
      width: 100%;
      height: 125px;
      background: #fdfbf7;
      border: 2px solid #b45309;
      border-radius: 6px;
      box-shadow: inset 0 0 10px rgba(180, 83, 9, 0.1), 0 3px 6px rgba(0,0,0,0.06);
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .shrine-illustration-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Question Slate */
    .question-slate {
      background: #ffffff;
      border: 3px double #b45309;
      border-radius: 6px;
      padding: 12px 18px;
      font-size: 1.22rem;
      font-weight: 800;
      color: #1c1917;
      line-height: 1.5;
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.08);
      margin-bottom: 10px;
    }

    .question-num {
      color: #991b1b;
      font-size: 1.35rem;
      margin-right: 8px;
      font-family: 'Yuji Boku', serif;
    }

    /* 4-Option Grid (2x2 Japanese Tile Layout) */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }

    .choice-tile {
      background: #faf4e8;
      border: 2px solid #d97706;
      border-radius: 6px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: #38251e;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      box-shadow: 0 3px 0 #b45309, 0 3px 6px rgba(0,0,0,0.05);
      transition: all 0.15s ease;
    }

    .choice-tile:hover:not([disabled]) {
      background: #fef9c3;
      border-color: #b45309;
      transform: translateY(-2px);
    }

    .choice-tile:active:not([disabled]) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b45309;
    }

    .tile-index {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #991b1b;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .choice-tile.wrong {
      background: #fee2e2 !important;
      border-color: #dc2626 !important;
      color: #991b1b !important;
      animation: shrineShake 0.35s ease;
      opacity: 0.85;
    }

    @keyframes shrineShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .choice-tile.correct {
      background: #ecfdf5 !important;
      border-color: #059669 !important;
      color: #065f46 !important;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.4) !important;
    }

    .choice-tile.correct .tile-index {
      background: #059669 !important;
    }

    /* Explanation Scroll (巻物) */
    .scroll-explanation {
      display: none;
      background: #fffbeb;
      border: 3px double #d97706;
      border-radius: 6px;
      padding: 12px 18px;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.12);
      animation: unrollScroll 0.35s ease-out;
      margin-top: 4px;
      margin-bottom: 10px;
    }

    @keyframes unrollScroll {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .scroll-title {
      font-size: 1rem;
      font-weight: 800;
      color: #991b1b;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      border-bottom: 1px dashed #ca8a04;
      padding-bottom: 3px;
    }

    .scroll-body {
      font-size: 0.92rem;
      line-height: 1.55;
      color: #451a03;
    }

    /* Footer Buttons Bar */
    .shrine-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }

    .hint-alert {
      font-size: 0.88rem;
      font-weight: 700;
      color: #b91c1c;
      min-height: 22px;
    }

    .btn-shrine-next {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      color: #ffffff;
      border: 2px solid #ca8a04;
      border-radius: 6px;
      padding: 9px 22px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #7f1d1d, 0 6px 15px rgba(0,0,0,0.2);
      display: none;
      transition: all 0.1s ease;
    }

    .btn-shrine-next:hover { background: #b91c1c; }
    .btn-shrine-next:active { transform: translateY(2px); box-shadow: 0 2px 0 #7f1d1d; }

    /* Catalog Drawer (巻物目録) */
    .catalog-modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(18, 10, 8, 0.88);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .catalog-board {
      background: #fdfbf7;
      width: 100%;
      max-width: 780px;
      max-height: 85%;
      border: 4px solid #991b1b;
      box-shadow: 0 0 0 3px #ca8a04;
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .catalog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #991b1b;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .catalog-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #991b1b;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 7px;
      overflow-y: auto;
      padding: 6px 4px;
      flex: 1;
    }

    .q-pill {
      background: #f4ede4;
      border: 1px solid #d97706;
      border-radius: 4px;
      padding: 7px 0;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      color: #38251e;
      transition: all 0.1s ease;
    }

    .q-pill:hover { background: #fef08a; }
    .q-pill.cleared { background: #dcfce7; border-color: #10b981; color: #047857; }
    .q-pill.active { background: #dc2626; color: #ffffff; border-color: #991b1b; }

    .btn-close-catalog {
      background: #78350f;
      color: #ffffff;
      border: none;
      padding: 6px 16px;
      font-family: inherit;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
    }

    /* Start / Finish Splash Screens */
    .splash-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #fbf7ee;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 26px;
      z-index: 50;
    }

    .splash-title {
      font-family: 'Yuji Boku', serif;
      font-size: 2.7rem;
      color: #991b1b;
      margin: 8px 0;
      letter-spacing: 4px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
    }

    .splash-subtitle {
      font-size: 1.1rem;
      color: #78350f;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .btn-start {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      color: #ffffff;
      border: 3px solid #ca8a04;
      border-radius: 8px;
      padding: 14px 38px;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 6px 0 #7f1d1d, 0 10px 25px rgba(0,0,0,0.25);
      transition: all 0.15s ease;
    }

    .btn-start:active { transform: translateY(3px); box-shadow: 0 3px 0 #7f1d1d; }

    @media (max-width: 720px) {
      .choices-grid { grid-template-columns: 1fr; }
      .shrine-illustration-box { height: 95px; }
      .question-slate { font-size: 1.05rem; }
      .choice-tile { font-size: 0.95rem; padding: 9px 12px; }
      .catalog-grid { grid-template-columns: repeat(5, 1fr); }
      .splash-title { font-size: 1.9rem; }
    }
  </style>
</head>
<body>

  <!-- Floating Sakura Canvas -->
  <canvas id="sakura-canvas"></canvas>

  <div class="shrine-viewport">
    
    <!-- Torii Top Banner -->
    <header class="torii-header">
      <div class="shrine-logo">
        <svg viewBox="0 0 24 24">
          <path d="M2,4 H22 V7 H20 V20 H17 V7 H7 V20 H4 V7 H2 Z M5,2 H19 V4 H5 Z"/>
        </svg>
        <span>試練の社 〜JLPT N5 摸底特訓〜</span>
      </div>
      <div class="header-ctrls">
        <span class="washi-badge" id="hud-progress">第 1 / 75 題</span>
        <span class="washi-badge" id="hud-score" style="color: #ca8a04;">初手正解: 0</span>
        <button class="btn-nav-catalog" onclick="openCatalog()">巻物目録 ☰</button>
      </div>
    </header>

    <!-- Question Stage -->
    <main class="stage-content" id="game-stage">
      <div class="part-ribbon" id="part-tag">第 1 部：格助詞・副助詞</div>
      
      <!-- Thematic Shrine Graphic Viewport -->
      <div class="shrine-illustration-box" id="illustration-container"></div>

      <!-- Question Slate -->
      <div class="question-slate" id="question-box">
        <span class="question-num" id="q-num">問1.</span>
        <span id="q-text">問題読み込み中...</span>
      </div>

      <div class="choices-grid" id="choices-container"></div>

      <div class="scroll-explanation" id="explanation-scroll">
        <div class="scroll-title">📜 文法指南・詳細解説</div>
        <div class="scroll-body" id="explanation-text"></div>
      </div>

      <footer class="shrine-footer">
        <div class="hint-alert" id="hint-msg"></div>
        <button class="btn-shrine-next" id="next-btn" onclick="nextQuestion()">次の試練へ進む ➜</button>
      </footer>
    </main>

    <!-- Start Screen -->
    <div class="splash-screen" id="start-screen">
      <svg width="90" height="90" viewBox="0 0 24 24" fill="#991b1b" style="margin-bottom: 8px;">
        <path d="M2,4 H22 V7 H20 V20 H17 V7 H7 V20 H4 V7 H2 Z M5,2 H19 V4 H5 Z"/>
      </svg>
      <h1 class="splash-title">JLPT N5 試練の社</h1>
      <p class="splash-subtitle">全6部 75題 綜合全方位摸底特訓（和風插畫版）</p>
      <div style="font-size: 0.95rem; color: #78350f; margin-bottom: 20px; line-height: 1.8;">
        六大部嚴格按順序推進，每部內部題目與選項隨機亂序。<br>
        每道試題均配有專屬日系圖示。答錯可多次重試，答對後即展開深度語法詳解！
      </div>
      <button class="btn-start" onclick="startGame()">參拜・試練開始</button>
    </div>

    <!-- Finish Screen -->
    <div class="splash-screen" id="finish-screen" style="display:none;">
      <div style="font-size: 3.8rem; margin-bottom: 6px;">🌸 大願成就 🌸</div>
      <h1 class="splash-title" style="color: #065f46;">全七十五問 摸底圓滿達成！</h1>
      <p class="splash-subtitle" id="finish-summary"></p>
      <button class="btn-start" onclick="restartGame()">重新挑戰 🔄</button>
    </div>

    <!-- Catalog Drawer (巻物目録) -->
    <div class="catalog-modal" id="catalog-modal">
      <div class="catalog-board">
        <div class="catalog-head">
          <div class="catalog-title">📜 試練目録（全七十五題）</div>
          <button class="btn-close-catalog" onclick="closeCatalog()">閉じる ✕</button>
        </div>
        <div class="catalog-grid" id="catalog-pills"></div>
      </div>
    </div>

  </div>

  <script>
    /* Traditional Web Audio Synthesizer */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTaiko() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    function playHyoshigi() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playKotoChime() {
      if (!audioCtx) return;
      const freqs = [523.25, 659.25, 783.99, 1046.50];
      freqs.forEach((f, i) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.45);
        }, i * 90);
      });
    }

    /* 75 Custom Japanese Vignette SVG Graphics */
    const graphicsCatalog = {
      1: `<svg viewBox="0 0 360 110"><rect width="360" height="110" fill="#fef3c7"/><rect x="140" y="25" width="80" height="60" rx="6" fill="#1e3a8a"/><polygon points="180,15 150,25 210,25" fill="#172554"/><circle cx="180" cy="55" r="14" fill="#fed7aa"/><text x="180" y="100" font-family="'Shippori Mincho', serif" font-size="12" fill="#78350f" text-anchor="middle">【学生証・自己紹介】</text></svg>`,
      2: `<svg viewBox="0 0 360 110"><rect width="360" height="110" fill="#fef3c7"/><rect x="110" y="20" width="140" height="70" rx="4" fill="#78350f"/><rect x="125" y="30" width="22" height="50" fill="#b91c1c"/><rect x="153" y="30" width="22" height="50" fill="#15803d"/><rect x="181" y="30" width="22" height="50" fill="#1d4ed8"/><rect x="209" y="30" width="22" height="50" fill="#ca8a04"/><text x="180" y="103" font-family="'Shippori Mincho', serif" font-size="12" fill="#78350f" text-anchor="middle">【図書館で読書】</text></svg>`,
      3: `<svg viewBox="0 0 360 110"><rect width="360" height="110" fill="#fef3c7"/><rect x="60" y="45" width="150" height="30" rx="15" fill="#f8fafc" stroke="#2563eb" stroke-width="3"/><rect x="250" y="25" width="40" height="50" fill="#991b1b"/><polygon points="270,10 240,25 300,25" fill="#78350f"/><text x="180" y="102" font-family="'Shippori Mincho', serif" font-size="12" fill="#78350f" text-anchor="middle">【新幹線で京都へ】</text></svg>`,
      4: `<svg viewBox="0 0 360 110"><rect width="360" height="110" fill="#fef3c7"/><rect x="120" y="30" width="45" height="45" rx="8" fill="#d97706"/><circle cx="195" cy="52" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="195" cy="52" r="11" fill="#f59e0b"/><text x="180" y="100" font-family="'Shippori Mincho', serif" font-size="12" fill="#78350f" text-anchor="middle">【朝食：パンと卵】</text></svg>`,
      5: `<svg viewBox="0 0 360 110"><rect width="360" height="110" fill="#fef3c7"/><rect x="120" y="20" width="120" height="65" fill="#334155"/><rect x="140" y="35" width="20" height="20" fill="#fef08a"/><rect x="170" y="35" width="20" height="20" fill="#fef08a"/><rect x="200" y="35" width="20" height="20" fill="#fef08a"/><text x="180" y="102" font-family="'Shippori Mincho', serif" font-size="12" fill="#78350f" text-anchor="middle">【日曜日にデパートで会う】</text></svg>`,

    // Fisher-Yates Array Shuffler
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Build the 75-question quiz queue: Parts strictly in order 1->2->3->4->5->6; questions & options randomized within each part!
    let activeQuestions = [];
    let currentIndex = 0;
    let firstTryCorrectCount = 0;
    let hasAttemptedWrong = false;
    let clearedQuestions = new Set();

    function assembleQuizQueue() {
      activeQuestions = [];
      rawParts.forEach(part => {
        const shuffledPartQuestions = shuffleArray(part.questions).map(item => ({
          ...item,
          partName: part.partName,
          graphicSVG: graphicsCatalog[item.id],
          shuffledOptions: shuffleArray(item.options)
        }));
        activeQuestions.push(...shuffledPartQuestions);
      });
    }

    function startGame() {
      initAudio();
      assembleQuizQueue();
      document.getElementById("start-screen").style.display = "none";
      renderQuestion();
    }

    function renderQuestion() {
      hasAttemptedWrong = false;
      const q = activeQuestions[currentIndex];

      document.getElementById("hud-progress").textContent = `第 ${currentIndex + 1} / 75 題`;
      document.getElementById("hud-score").textContent = `初手正解: ${firstTryCorrectCount}`;
      document.getElementById("part-tag").textContent = q.partName;
      document.getElementById("illustration-container").innerHTML = q.graphicSVG;
      document.getElementById("q-num").textContent = `原問${q.id}.`;
      document.getElementById("q-text").textContent = q.q;
      
      document.getElementById("hint-msg").textContent = "";
      document.getElementById("explanation-scroll").style.display = "none";
      document.getElementById("next-btn").style.display = "none";

      const container = document.getElementById("choices-container");
      container.innerHTML = "";

      q.shuffledOptions.forEach((optText, idx) => {
        const optionNum = idx + 1;
        const btn = document.createElement("button");
        btn.className = "choice-tile";
        btn.innerHTML = `<span class="tile-index">${optionNum}</span><span>${optText}</span>`;
        btn.onclick = () => checkChoice(optText, btn);
        container.appendChild(btn);
      });
    }

    function checkChoice(selectedText, btnElement) {
      const q = activeQuestions[currentIndex];

      if (selectedText === q.correct) {
        // Correct Choice
        btnElement.classList.add("correct");
        document.querySelectorAll(".choice-tile").forEach(b => b.disabled = true);
        
        playKotoChime();
        clearedQuestions.add(currentIndex);

        if (!hasAttemptedWrong) {
          firstTryCorrectCount++;
          document.getElementById("hud-score").textContent = `初手正解: ${firstTryCorrectCount}`;
        }

        // Show detailed explanation scroll
        document.getElementById("explanation-text").innerHTML = `<strong>【正解：${q.correct}】</strong><br>${q.exp}`;
        document.getElementById("explanation-scroll").style.display = "block";
        document.getElementById("hint-msg").innerHTML = "<span style='color:#059669;'>🌸 見事、正解です！</span>";
        document.getElementById("next-btn").style.display = "block";

      } else {
        // Wrong Choice -> Play Taiko, mark red, keep others enabled for re-try
        hasAttemptedWrong = true;
        playTaiko();
        btnElement.classList.add("wrong");
        btnElement.disabled = true;

        document.getElementById("hint-msg").textContent = "惜しい！もう一度文脈を見直してみましょう（再選択可）";
      }
    }

    function nextQuestion() {
      playHyoshigi();
      if (currentIndex < activeQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        finishGame();
      }
    }

    function finishGame() {
      document.getElementById("finish-screen").style.display = "flex";
      document.getElementById("finish-summary").innerHTML = 
        `全75問の摸底試練を見事完遂しました！<br>一度も間違えずに即答できた問題数：<strong>${firstTryCorrectCount} / 75 題</strong>`;
    }

    function restartGame() {
      currentIndex = 0;
      firstTryCorrectCount = 0;
      clearedQuestions.clear();
      document.getElementById("finish-screen").style.display = "none";
      assembleQuizQueue();
      renderQuestion();
    }

    // Catalog (巻物目録) Navigation
    function openCatalog() {
      playHyoshigi();
      const grid = document.getElementById("catalog-pills");
      grid.innerHTML = "";

      activeQuestions.forEach((q, idx) => {
        const pill = document.createElement("div");
        pill.className = "q-pill";
        if (clearedQuestions.has(idx)) pill.classList.add("cleared");
        if (idx === currentIndex) pill.classList.add("active");
        pill.textContent = `${idx + 1}`;
        pill.title = `${q.partName} - 原問${q.id}`;
        pill.onclick = () => {
          currentIndex = idx;
          closeCatalog();
          renderQuestion();
        };
        grid.appendChild(pill);
      });

      document.getElementById("catalog-modal").style.display = "flex";
    }

    function closeCatalog() {
      document.getElementById("catalog-modal").style.display = "none";
    }

    // Drifting Sakura Petals Canvas Engine
    const canvas = document.getElementById("sakura-canvas");
    const ctx = canvas.getContext("2d");
    let petals = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class SakuraPetal {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.size = Math.random() * 8 + 6;
        this.speedX = Math.random() * 1.5 - 0.5;
        this.speedY = Math.random() * 1.5 + 1.2;
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 2 - 1;
        this.opacity = Math.random() * 0.5 + 0.4;
      }
      update() {
        this.x += this.speedX + Math.sin(this.y * 0.01) * 0.6;
        this.y += this.speedY;
        this.rotation += this.rotSpeed;
        if (this.y > canvas.height + 20) this.reset();
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = "#fbcfe8";
        
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size / 2, -this.size / 2, -this.size, this.size / 3, 0, this.size);
        ctx.bezierCurveTo(this.size, this.size / 3, this.size / 2, -this.size / 2, 0, 0);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 45; i++) {
      petals.push(new SakuraPetal());
    }

    function animateSakura() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      petals.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateSakura);
    }
    animateSakura();
  </script>
</body>
</html>
