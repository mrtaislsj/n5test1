<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JLPT N5 総合全方位摸底特訓 〜試練の社〜</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Yuji+Boku&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #261613 0%, #120a08 100%);
      font-family: 'Shippori Mincho', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
      color: #38251e;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Falling Sakura Canvas */
    #sakura-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* 16:9 Traditional Japanese Shrine Frame */
    .shrine-viewport {
      width: min(96vw, 170.6vh);
      height: min(54vw, 96vh);
      aspect-ratio: 16 / 9;
      background: #fbf7ee;
      background-image: 
        radial-gradient(#eedec6 12%, transparent 13%), 
        linear-gradient(to bottom, rgba(255,255,255,0.7), rgba(250,240,225,0.9));
      background-size: 24px 24px, 100% 100%;
      border: 8px solid #991b1b;
      border-radius: 8px;
      box-shadow: 
        0 0 0 3px #ca8a04,
        0 0 0 7px #450a0a,
        0 18px 45px rgba(0, 0, 0, 0.95);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 20;
    }

    /* Top Torii Shrine Header */
    .torii-header {
      background: linear-gradient(180deg, #991b1b 0%, #7f1d1d 100%);
      border-bottom: 4px solid #ca8a04;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fef08a;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      position: relative;
      z-index: 25;
    }

    .shrine-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 1px 1px 2px #000;
    }

    .shrine-logo svg {
      width: 26px;
      height: 26px;
      fill: #fef08a;
    }

    .header-ctrls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .washi-badge {
      background: #450a0a;
      border: 1px solid #ca8a04;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.82rem;
      color: #fef08a;
      font-weight: 700;
    }

    .btn-nav-catalog {
      background: #ca8a04;
      color: #38251e;
      border: none;
      border-radius: 4px;
      padding: 5px 12px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.82rem;
      box-shadow: 0 2px 0 #78350f;
      transition: all 0.1s ease;
    }

    .btn-nav-catalog:hover { background: #eab308; }
    .btn-nav-catalog:active { transform: translateY(2px); box-shadow: none; }

    /* Main Stage Body */
    .stage-content {
      flex: 1;
      padding: 10px 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
    }

    .part-ribbon {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      background: #dc2626;
      color: #ffffff;
      padding: 3px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 3px;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
      margin-bottom: 6px;
    }

    /* Complex Art Viewport */
    .shrine-illustration-box {
      width: 100%;
      height: 136px;
      background: #18110e;
      border: 2px solid #b45309;
      border-radius: 6px;
      box-shadow: inset 0 0 14px rgba(0,0,0,0.6), 0 3px 8px rgba(0,0,0,0.12);
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .shrine-illustration-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Question Slate */
    .question-slate {
      background: #ffffff;
      border: 3px double #b45309;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 1.18rem;
      font-weight: 800;
      color: #1c1917;
      line-height: 1.45;
      box-shadow: 0 4px 10px rgba(180, 83, 9, 0.08);
      margin-bottom: 8px;
    }

    .question-num {
      color: #991b1b;
      font-size: 1.3rem;
      margin-right: 8px;
      font-family: 'Yuji Boku', serif;
    }

    /* 4-Option Grid (2x2 Japanese Tile Layout) */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .choice-tile {
      background: #faf4e8;
      border: 2px solid #d97706;
      border-radius: 6px;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 1.02rem;
      font-weight: 700;
      color: #38251e;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      box-shadow: 0 3px 0 #b45309, 0 3px 6px rgba(0,0,0,0.05);
      transition: all 0.15s ease;
    }

    .choice-tile:hover:not([disabled]) {
      background: #fef9c3;
      border-color: #b45309;
      transform: translateY(-2px);
    }

    .choice-tile:active:not([disabled]) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b45309;
    }

    .tile-index {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #991b1b;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .choice-tile.wrong {
      background: #fee2e2 !important;
      border-color: #dc2626 !important;
      color: #991b1b !important;
      animation: shrineShake 0.35s ease;
      opacity: 0.85;
    }

    @keyframes shrineShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .choice-tile.correct {
      background: #ecfdf5 !important;
      border-color: #059669 !important;
      color: #065f46 !important;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.4) !important;
    }

    .choice-tile.correct .tile-index {
      background: #059669 !important;
    }

    /* Explanation Scroll (巻物) */
    .scroll-explanation {
      display: none;
      background: #fffbeb;
      border: 3px double #d97706;
      border-radius: 6px;
      padding: 10px 16px;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.12);
      animation: unrollScroll 0.35s ease-out;
      margin-top: 2px;
      margin-bottom: 8px;
    }

    @keyframes unrollScroll {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .scroll-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #991b1b;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      border-bottom: 1px dashed #ca8a04;
      padding-bottom: 2px;
    }

    .scroll-body {
      font-size: 0.88rem;
      line-height: 1.5;
      color: #451a03;
    }

    /* Footer Buttons Bar */
    .shrine-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 2px;
    }

    .hint-alert {
      font-size: 0.85rem;
      font-weight: 700;
      color: #b91c1c;
      min-height: 20px;
    }

    .btn-shrine-next {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      color: #ffffff;
      border: 2px solid #ca8a04;
      border-radius: 6px;
      padding: 8px 20px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #7f1d1d, 0 6px 15px rgba(0,0,0,0.2);
      display: none;
      transition: all 0.1s ease;
    }

    .btn-shrine-next:hover { background: #b91c1c; }
    .btn-shrine-next:active { transform: translateY(2px); box-shadow: 0 2px 0 #7f1d1d; }

    /* Catalog Drawer (巻物目録) */
    .catalog-modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(18, 10, 8, 0.88);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .catalog-board {
      background: #fdfbf7;
      width: 100%;
      max-width: 780px;
      max-height: 85%;
      border: 4px solid #991b1b;
      box-shadow: 0 0 0 3px #ca8a04;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .catalog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #991b1b;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .catalog-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #991b1b;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      overflow-y: auto;
      padding: 4px;
      flex: 1;
    }

    .q-pill {
      background: #f4ede4;
      border: 1px solid #d97706;
      border-radius: 4px;
      padding: 6px 0;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      color: #38251e;
      transition: all 0.1s ease;
    }

    .q-pill:hover { background: #fef08a; }
    .q-pill.cleared { background: #dcfce7; border-color: #10b981; color: #047857; }
    .q-pill.active { background: #dc2626; color: #ffffff; border-color: #991b1b; }

    .btn-close-catalog {
      background: #78350f;
      color: #ffffff;
      border: none;
      padding: 5px 14px;
      font-family: inherit;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
    }

    /* Start / Finish Splash Screens */
    .splash-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #fbf7ee;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 50;
    }

    .splash-title {
      font-family: 'Yuji Boku', serif;
      font-size: 2.6rem;
      color: #991b1b;
      margin: 8px 0;
      letter-spacing: 4px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
    }

    .splash-subtitle {
      font-size: 1.05rem;
      color: #78350f;
      margin-bottom: 18px;
      font-weight: 700;
    }

    .btn-start {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      color: #ffffff;
      border: 3px solid #ca8a04;
      border-radius: 8px;
      padding: 13px 36px;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 6px 0 #7f1d1d, 0 10px 25px rgba(0,0,0,0.25);
      transition: all 0.15s ease;
    }

    .btn-start:active { transform: translateY(3px); box-shadow: 0 3px 0 #7f1d1d; }

    @media (max-width: 720px) {
      .choices-grid { grid-template-columns: 1fr; }
      .shrine-illustration-box { height: 100px; }
      .question-slate { font-size: 1.02rem; }
      .choice-tile { font-size: 0.92rem; padding: 8px 10px; }
      .catalog-grid { grid-template-columns: repeat(5, 1fr); }
      .splash-title { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <!-- Floating Sakura Canvas -->
  <canvas id="sakura-canvas"></canvas>

  <div class="shrine-viewport">
    
    <!-- Torii Top Banner -->
    <header class="torii-header">
      <div class="shrine-logo">
        <svg viewBox="0 0 24 24">
          <path d="M2,4 H22 V7 H20 V20 H17 V7 H7 V20 H4 V7 H2 Z M5,2 H19 V4 H5 Z"/>
        </svg>
        <span>試練の社 〜JLPT N5 摸底特訓〜</span>
      </div>
      <div class="header-ctrls">
        <span class="washi-badge" id="hud-progress">第 1 / 75 題</span>
        <span class="washi-badge" id="hud-score" style="color: #ca8a04;">初手正解: 0</span>
        <button class="btn-nav-catalog" onclick="openCatalog()">巻物目録 ☰</button>
      </div>
    </header>

    <!-- Question Stage -->
    <main class="stage-content" id="game-stage">
      <div class="part-ribbon" id="part-tag">第 1 部：格助詞・副助詞</div>
      
      <!-- High-Detail Thematic SVG Art Box -->
      <div class="shrine-illustration-box" id="illustration-container"></div>

      <!-- Question Slate -->
      <div class="question-slate" id="question-box">
        <span class="question-num" id="q-num">問1.</span>
        <span id="q-text">問題読み込み中...</span>
      </div>

      <div class="choices-grid" id="choices-container"></div>

      <div class="scroll-explanation" id="explanation-scroll">
        <div class="scroll-title">📜 文法指南・詳細解説</div>
        <div class="scroll-body" id="explanation-text"></div>
      </div>

      <footer class="shrine-footer">
        <div class="hint-alert" id="hint-msg"></div>
        <button class="btn-shrine-next" id="next-btn" onclick="nextQuestion()">次の試練へ進む ➜</button>
      </footer>
    </main>

    <!-- Start Screen -->
    <div class="splash-screen" id="start-screen">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="#991b1b" style="margin-bottom: 8px;">
        <path d="M2,4 H22 V7 H20 V20 H17 V7 H7 V20 H4 V7 H2 Z M5,2 H19 V4 H5 Z"/>
      </svg>
      <h1 class="splash-title">JLPT N5 試練の社</h1>
      <p class="splash-subtitle">全6部 75題 綜合全方位摸底特訓（精緻和風雅圖版）</p>
      <div style="font-size: 0.95rem; color: #78350f; margin-bottom: 20px; line-height: 1.8;">
        六大部依序推進，各部內部題目與選項隨機亂序。<br>
        精雕浮世和風插圖與意境標題（絕無透題題眼）。答錯可反覆挑戰，答對即展卷研習！
      </div>
      <button class="btn-start" onclick="startGame()">參拜・試練開始</button>
    </div>

    <!-- Finish Screen -->
    <div class="splash-screen" id="finish-screen" style="display:none;">
      <div style="font-size: 3.5rem; margin-bottom: 6px;">🌸 大願成就 🌸</div>
      <h1 class="splash-title" style="color: #065f46;">全七十五問 摸底圓滿達成！</h1>
      <p class="splash-subtitle" id="finish-summary"></p>
      <button class="btn-start" onclick="restartGame()">重新挑戰 🔄</button>
    </div>

    <!-- Catalog Drawer (巻物目録) -->
    <div class="catalog-modal" id="catalog-modal">
      <div class="catalog-board">
        <div class="catalog-head">
          <div class="catalog-title">📜 試練目録（全七十五題）</div>
          <button class="btn-close-catalog" onclick="closeCatalog()">閉じる ✕</button>
        </div>
        <div class="catalog-grid" id="catalog-pills"></div>
      </div>
    </div>

  </div>

  <script>
    /* Traditional Web Audio Synthesizer */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTaiko() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    function playHyoshigi() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playKotoChime() {
      if (!audioCtx) return;
      const freqs = [523.25, 659.25, 783.99, 1046.50];
      freqs.forEach((f, i) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.45);
        }, i * 90);
      });
    }

    /* Architectural & Ukiyo-e Scene Builders (High Complexity & Zero Spoilers) */
    function buildComplexArtwork(themeType, caption) {
      // Common Master Gradients and Decorative Elements
      const defs = `
        <defs>
          <linearGradient id="gSkyDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="50%" stop-color="#701a75"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
          <linearGradient id="gSkyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="65%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
          <linearGradient id="gGoldMist" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ca8a04" stop-opacity="0.8"/><stop offset="50%" stop-color="#fef08a" stop-opacity="0.95"/><stop offset="100%" stop-color="#ca8a04" stop-opacity="0.8"/></linearGradient>
          <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#78350f"/><stop offset="100%" stop-color="#291205"/></linearGradient>
          <linearGradient id="gTorii" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7f1d1d"/><stop offset="50%" stop-color="#dc2626"/><stop offset="100%" stop-color="#7f1d1d"/></linearGradient>
          <linearGradient id="gInk" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
          <pattern id="patSeigaiha" width="20" height="10" patternUnits="userSpaceOnUse"><path d="M 0,10 A 10,10 0 0,1 20,10 M 10,10 A 5,5 0 0,1 20,10 M 0,10 A 5,5 0 0,1 10,10" fill="none" stroke="#fde047" stroke-width="0.7" opacity="0.25"/></pattern>
        </defs>
      `;

      let scene = "";

      switch(themeType) {
        case "school":
          scene = `
            <rect width="480" height="136" fill="url(#gSkyDay)"/>
            <rect x="0" y="88" width="480" height="48" fill="#573318"/>
            <rect x="0" y="85" width="480" height="4" fill="#2d1706"/>
            <!-- Shoji Window Lattice Frame -->
            <rect x="30" y="10" width="130" height="75" fill="#fdfbf7" stroke="#2d1706" stroke-width="3"/>
            <line x1="30" y1="35" x2="160" y2="35" stroke="#78350f" stroke-width="1.5"/>
            <line x1="30" y1="60" x2="160" y2="60" stroke="#78350f" stroke-width="1.5"/>
            <line x1="73" y1="10" x2="73" y2="85" stroke="#78350f" stroke-width="1.5"/>
            <line x1="116" y1="10" x2="116" y2="85" stroke="#78350f" stroke-width="1.5"/>
            <!-- Sakura branch peeking outside window -->
            <path d="M10,15 Q60,25 90,45" stroke="#451a03" stroke-width="2.5" fill="none"/>
            <circle cx="55" cy="22" r="4.5" fill="#f472b6"/><circle cx="75" cy="36" r="5" fill="#fb7185"/><circle cx="92" cy="46" r="4" fill="#f472b6"/>
            <!-- Wooden Lectern & Inkstone Desk -->
            <rect x="230" y="55" width="180" height="35" rx="3" fill="url(#gWood)" stroke="#1a0c02" stroke-width="2"/>
            <rect x="260" y="88" width="16" height="40" fill="#2d1706"/><rect x="375" y="88" width="16" height="40" fill="#2d1706"/>
            <rect x="265" y="47" width="50" height="8" rx="2" fill="#3b82f6"/>
            <rect x="330" y="45" width="35" height="10" rx="2" fill="#0f172a"/>
            <line x1="340" y1="40" x2="385" y2="40" stroke="#ca8a04" stroke-width="2"/>

        partName: "第 6 部：生活語彙・漢字読み・慣用表現",
        questions: [
          { id: 63, q: "私は 毎朝 6時半に （  ）。", options: ["おきます", "ねます", "かえります", "いきます"], correct: "おきます", exp: "早晨起床動作為 「起きる（おきます）」。「寝ます」是去睡覺。"},
          { id: 64, q: "友達と カフェで （  ）を しました。", options: ["食事", "散歩", "運動", "見学"], correct: "食事", exp: "在餐廳進行的動作合乎常理的是 「食事（しょくじ）をする」。"},
          { id: 65, q: "出かける 人に「いってきます」と 言われました。何と 答えますか。", options: ["いってらっしゃい", "おかえりなさい", "ただいま", "ごちそうさま"], correct: "いってらっしゃい", exp: "對外出門者講「いってきます（我出門喇）」時，留守在家者唯一固定回敬禮貌用語為 「いってらっしゃい（慢走／小心行）」。"},
          { id: 66, q: "日本では ご飯を 食べる （  ）に「いただきます」と 言います。", options: ["まえ", "あと", "とき", "ころ"], correct: "まえ", exp: "日本人在「開飯之前」雙手合十說 「いただきます」；食飽之後說「ごちそうさまでした」。"},
          { id: 67, q: "毎朝 駅で 新聞を （  ）。", options: ["買います", "読みます", "聞きます", "書きます"], correct: "買います", exp: "在車站（場所で）對報紙進行的交換動作最標準為「購買（買います）」。"},
          { id: 68, q: "毎朝 起きてから、シャワーを （  ）。", options: ["あびます", "入ります", "あらいます", "つけます"], correct: "あびます", exp: "淋浴在日語為不可分割固定動賓搭配：「シャワーを 浴びる（あびます）」。"},
          { id: 69, q: "頭が 痛いですから、風邪の 薬を （  ）ました。", options: ["のみ", "たべ", "すい", "かけ"], correct: "のみ", exp: "日語中「食藥」一律用動詞 「飲む（のみます）」，絕不能用「食べる」！"},
          { id: 70, q: "今日は 寒いですから、厚い コートを （  ）出かけます。", options: ["着て", "はいて", "かぶって", "かけて"], correct: "着て", exp: "上半身衣物或全身大衣（コート、シャツ）穿著動詞為 「着る（着て）」；鞋襪褲用「はく」；帽子用「かぶる」；配件用「かける／する」。"},
          { id: 71, q: "田中さんは 黒い 眼鏡を （  ）います。", options: ["かけて", "着て", "はいて", "つけて"], correct: "かけて", exp: "戴眼鏡固定動詞為 「眼鏡を かける」（現在戴著的狀態為「かけています」）。"},
          { id: 72, q: "部屋に 入る 前に、靴を （  ）ください。", options: ["ぬいで", "はいて", "とって", "あげて"], correct: "ぬいで", exp: "脫掉衣物、鞋襪的動詞為 「脱ぐ（ぬぐ）」，て形為促音便轉濁音 「ぬいで」。"},
          { id: 73, q: "駅で 電車に （  ）とき、切符を 見せます。", options: ["乗る", "降りる", "止まる", "出る"], correct: "乗る", exp: "登上交通工具固定動詞為 「〜に 乗る（のる）」（電車に乗る）。下車為「〜を 降りる」。"},
          { id: 74, q: "【漢字読み】「今日」の 読み方は どれですか。", options: ["きょう", "こんにち", "きのう", "あした"], correct: "きょう", exp: "「今日」在日常單獨使用時，標準訓讀為 「きょう」。"},
          { id: 75, q: "【漢字読み】「外国」の 読み方は どれですか。", options: ["がいこく", "がいごく", "そとくに", "げこく"], correct: "がいこく", exp: "「外国」音讀為 「がいこく」。「国」單字讀「くに」，但在複合音讀中讀「こく」，不可混淆。"}
        ]
      }
    ];

    // Fisher-Yates Array Shuffler
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Assemble Quiz Queue: 6 parts in strict designated order, questions & options randomized within each part
    let activeQuestions = [];
    let currentIndex = 0;
    let firstTryCorrectCount = 0;
    let hasAttemptedWrong = false;
    let clearedQuestions = new Set();

    function assembleQuizQueue() {
      activeQuestions = [];
      rawParts.forEach(part => {
        const shuffledPartQuestions = shuffleArray(part.questions).map(item => {
          const meta = questionVisualMeta[item.id] || { theme: "landscape", caption: "【 試 練 の 図 】" };
          return {
            ...item,
            partName: part.partName,
            graphicSVG: buildComplexArtwork(meta.theme, meta.caption),
            shuffledOptions: shuffleArray(item.options)
          };
        });
        activeQuestions.push(...shuffledPartQuestions);
      });
    }

    function startGame() {
      initAudio();
      assembleQuizQueue();
      document.getElementById("start-screen").style.display = "none";
      renderQuestion();
    }

    function renderQuestion() {
      hasAttemptedWrong = false;
      const q = activeQuestions[currentIndex];

      document.getElementById("hud-progress").textContent = `第 ${currentIndex + 1} / 75 題`;
      document.getElementById("hud-score").textContent = `初手正解: ${firstTryCorrectCount}`;
      document.getElementById("part-tag").textContent = q.partName;
      document.getElementById("illustration-container").innerHTML = q.graphicSVG;
      document.getElementById("q-num").textContent = `原問${q.id}.`;
      document.getElementById("q-text").textContent = q.q;
      
      document.getElementById("hint-msg").textContent = "";
      document.getElementById("explanation-scroll").style.display = "none";
      document.getElementById("next-btn").style.display = "none";

      const container = document.getElementById("choices-container");
      container.innerHTML = "";

      q.shuffledOptions.forEach((optText, idx) => {
        const optionNum = idx + 1;
        const btn = document.createElement("button");
        btn.className = "choice-tile";
        btn.innerHTML = `<span class="tile-index">${optionNum}</span><span>${optText}</span>`;
        btn.onclick = () => checkChoice(optText, btn);
        container.appendChild(btn);
      });
    }

    function checkChoice(selectedText, btnElement) {
      const q = activeQuestions[currentIndex];

      if (selectedText === q.correct) {
        // Correct Choice
        btnElement.classList.add("correct");
        document.querySelectorAll(".choice-tile").forEach(b => b.disabled = true);
        
        playKotoChime();
        clearedQuestions.add(currentIndex);

        if (!hasAttemptedWrong) {
          firstTryCorrectCount++;
          document.getElementById("hud-score").textContent = `初手正解: ${firstTryCorrectCount}`;
        }

        // Show detailed explanation scroll
        document.getElementById("explanation-text").innerHTML = `<strong>【正解：${q.correct}】</strong><br>${q.exp}`;
        document.getElementById("explanation-scroll").style.display = "block";
        document.getElementById("hint-msg").innerHTML = "<span style='color:#059669;'>🌸 見事、正解です！</span>";
        document.getElementById("next-btn").style.display = "block";

      } else {
        // Wrong Choice -> Play Taiko, mark red, keep others enabled for re-try
        hasAttemptedWrong = true;
        playTaiko();
        btnElement.classList.add("wrong");
        btnElement.disabled = true;

        document.getElementById("hint-msg").textContent = "惜しい！もう一度文脈を見直してみましょう（再選択可）";
      }
    }

    function nextQuestion() {
      playHyoshigi();
      if (currentIndex < activeQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        finishGame();
      }
    }

    function finishGame() {
      document.getElementById("finish-screen").style.display = "flex";
      document.getElementById("finish-summary").innerHTML = 
        `全75問の摸底試練を見事完遂しました！<br>一度も間違えずに即答できた問題数：<strong>${firstTryCorrectCount} / 75 題</strong>`;
    }

    function restartGame() {
      currentIndex = 0;
      firstTryCorrectCount = 0;
      clearedQuestions.clear();
      document.getElementById("finish-screen").style.display = "none";
      assembleQuizQueue();
      renderQuestion();
    }

    // Catalog (巻物目録) Navigation
    function openCatalog() {
      playHyoshigi();
      const grid = document.getElementById("catalog-pills");
      grid.innerHTML = "";

      activeQuestions.forEach((q, idx) => {
        const pill = document.createElement("div");
        pill.className = "q-pill";
        if (clearedQuestions.has(idx)) pill.classList.add("cleared");
        if (idx === currentIndex) pill.classList.add("active");
        pill.textContent = `${idx + 1}`;
        pill.title = `${q.partName} - 原問${q.id}`;
        pill.onclick = () => {
          currentIndex = idx;
          closeCatalog();
          renderQuestion();
        };
        grid.appendChild(pill);
      });

      document.getElementById("catalog-modal").style.display = "flex";
    }

    function closeCatalog() {
      document.getElementById("catalog-modal").style.display = "none";
    }

    // Drifting Sakura Petals Canvas Engine
    const canvas = document.getElementById("sakura-canvas");
    const ctx = canvas.getContext("2d");
    let petals = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class SakuraPetal {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.size = Math.random() * 8 + 6;
        this.speedX = Math.random() * 1.5 - 0.5;
        this.speedY = Math.random() * 1.5 + 1.2;
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 2 - 1;
        this.opacity = Math.random() * 0.5 + 0.4;
      }
      update() {
        this.x += this.speedX + Math.sin(this.y * 0.01) * 0.6;
        this.y += this.speedY;
        this.rotation += this.rotSpeed;
        if (this.y > canvas.height + 20) this.reset();
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = "#fbcfe8";
        
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size / 2, -this.size / 2, -this.size, this.size / 3, 0, this.size);
        ctx.bezierCurveTo(this.size, this.size / 3, this.size / 2, -this.size / 2, 0, 0);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 45; i++) {
      petals.push(new SakuraPetal());
    }

    function animateSakura() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      petals.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateSakura);
    }
    animateSakura();
  </script>
</body>
